name: Test and build desktop apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[build]"
      - run: python -m unittest discover -v
      - run: python scripts/build.py
      - uses: actions/upload-artifact@v6
        with:
          name: AutoClap-${{ runner.os }}-${{ runner.arch }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
