[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-clap-desktop"
version = "1.0.0"
description = "Tự thả vỗ tay cho tin nhắn Telegram phù hợp"
requires-python = ">=3.11"
dependencies = [
    "Telethon>=1.42,<2",
    "PySide6-Essentials>=6.8,<7",
    "platformdirs>=4,<5",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.11,<7"]

[project.gui-scripts]
auto-clap = "autoclap.__main__:main"

[tool.setuptools.packages.find]
include = ["autoclap*"]
